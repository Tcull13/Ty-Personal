name: JJC public demo verification

on:
  push:
    branches: [jjc-demo-site]
    paths: ['.github/workflows/jjc-inline-repair.yml']

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /tmp/jjc-browser-install.log 2>&1
      - name: Open the normal content notice and verify the public demo
        run: |
          mkdir -p jjc-public-check
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          commit='040fd22994d1f36693854b202812ced2fbe1bd4d'
          results={'source_commit':commit,'real_submissions_sent':0,'checks':[]}
          def save(): Path('jjc-public-check/results.json').write_text(json.dumps(results,indent=2))
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for host in ('rawcdn.githack.com','raw.githack.com'):
                  for width,height in [(390,844),(1440,1000)]:
                      context=browser.new_context(viewport={'width':width,'height':height})
                      page=context.new_page()
                      row={'url':f'https://{host}/Tcull13/Ty-Personal/{commit}/jjc-demo/index.html','width':width,'started_with_no_cookies':True,'credentials_provided':False}
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      try:
                          response=page.goto(row['url'],wait_until='networkidle',timeout=45000)
                          row['initial_status']=response.status if response else None
                          row['initial_title']=page.title()
                          if page.title()=='External Content Notice | rawgit.hack':
                              row['content_notice_shown']=True
                              page.get_by_text('Open the page',exact=True).click()
                          page.locator('#quoteForm').wait_for(state='visible',timeout=25000)
                          page.wait_for_load_state('networkidle',timeout=20000)
                          row.update(final_url=page.url,title=page.title(),quote_form_present=True,overflow_px=page.evaluate('Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth'),script_errors=errors,images=page.evaluate('[...document.images].map(i=>({loaded:i.complete&&i.naturalWidth>0,src:i.currentSrc}))'))
                          if width<=1100:
                              page.locator('.menu').click()
                              row['menu_opens']=page.locator('.menu').get_attribute('aria-expanded')=='true'
                              page.keyboard.press('Escape')
                              row['menu_closes']=page.locator('.menu').get_attribute('aria-expanded')=='false'
                          page.screenshot(path=f'jjc-public-check/home-{host}-{width}.png')
                          page.locator('#quoteForm').scroll_into_view_if_needed()
                          page.screenshot(path=f'jjc-public-check/quote-{host}-{width}.png')
                          sent=[]
                          def mock(route):
                              sent.append(route.request.post_data)
                              route.fulfill(status=200,content_type='application/json',headers={'Access-Control-Allow-Origin':'*'},body=json.dumps({'success':'false','message':'This form needs Activation.'}))
                          page.route('https://formsubmit.co/**',mock)
                          page.locator('#name').fill('QA TEST - NOT A CUSTOMER')
                          page.locator('#phone').fill('7815550100')
                          page.locator('#location').fill('Quincy - simulated')
                          page.locator('#service').select_option(label='House washing')
                          page.locator('#sendQuote').click()
                          page.wait_for_function("document.querySelector('#status').dataset.state==='activation'",timeout=15000)
                          row['simulated_activation_handled']=page.locator('#quoteFallback').is_visible()
                          row['public_browser_pass']=row['overflow_px']<=1 and not errors and row.get('menu_opens',True) and row.get('menu_closes',True) and row['simulated_activation_handled']
                      except Exception as exc:
                          row.update(error=str(exc)[:1000],final_url=page.url,final_title=page.title(),body_excerpt=page.locator('body').inner_text()[:1000])
                          page.screenshot(path=f'jjc-public-check/error-{host}-{width}.png')
                      results['checks'].append(row)
                      save()
                      context.close()
              browser.close()
          print('JJC_PUBLIC_BROWSER_RESULTS '+json.dumps(results))
          PY
      - name: Save public-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjc-public-browser-evidence
          path: jjc-public-check/
          retention-days: 14
          if-no-files-found: warn
